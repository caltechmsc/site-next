name: CI

on:
  - push
  - pull_request

env:
  DATABASE_URL: "file:./ci.db"

  JWT_SECRET: "this-is-a-dummy-jwt-secret-for-ci-build-only-at-least-32-chars-long"
  GOOGLE_CLIENT_ID: "dummy-google-client-id-for-ci.apps.googleusercontent.com"
  GOOGLE_CLIENT_SECRET: "dummy-google-client-secret-for-ci"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check Formatting
        run: npm run format -- --check

      - name: Lint
        run: npm run lint

      - name: Type Check
        run: npx tsc --noEmit

      - name: Setup Database
        run: npm run db:push

      - name: Build
        run: npm run build
